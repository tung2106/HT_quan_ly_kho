# Chỉ tạo web miễn phí; PostgreSQL được tạo riêng ở Neon Free.
services:
  - type: web
    name: kho-gia-dinh
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeployTrigger: 'off'
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: NEON_DATABASE_HOST
        sync: false
      - key: NEON_DATABASE_NAME
        sync: false
      - key: NEON_DATABASE_USERNAME
        sync: false
      - key: NEON_DATABASE_PASSWORD
        sync: false
      - key: APP_ADMIN_USERNAME
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
