services:
  db:
    image: postgres:16
    container_name: vatlieu-db
    environment:
      POSTGRES_DB: vatlieu
      POSTGRES_USER: vatlieu
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD before starting}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
