# Chỉ bật trên máy chủ HTTPS bằng SPRING_PROFILES_ACTIVE=prod.
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Dùng kết nối trực tiếp Neon (không có -pooler), mật khẩu đặt trong Environment.
spring.datasource.url=jdbc:postgresql://${NEON_DATABASE_HOST}/${NEON_DATABASE_NAME}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
spring.datasource.username=${NEON_DATABASE_USERNAME}
spring.datasource.password=${NEON_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# Phiếu dùng TIMESTAMP không kèm múi giờ: giữ giờ Việt Nam khi chạy trên cloud.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Ho_Chi_Minh'

spring.thymeleaf.cache=true
