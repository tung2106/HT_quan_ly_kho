<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nhà cung cấp')}"></head>
<body>
<div class="container py-3">
  <h5 class="mb-3">Nhà cung cấp</h5>
  <div th:replace="~{fragments :: alerts}"></div>
  <nav class="d-flex gap-2 mb-3" aria-label="Danh sách nhà cung cấp">
    <a class="btn flex-fill" th:classappend="${deleted ? 'btn-outline-primary' : 'btn-primary'}" th:href="@{/suppliers(keyword=${keyword})}">Đang sử dụng</a>
    <a class="btn flex-fill" th:classappend="${deleted ? 'btn-primary' : 'btn-outline-primary'}" th:href="@{/suppliers(deleted=true,keyword=${keyword})}">Đã xóa</a>
  </nav>
  <form method="get" th:action="@{/suppliers}" class="card card-body mb-3">
    <input type="hidden" name="deleted" th:value="${deleted}">
    <label class="form-label" for="supplier-search">Tìm theo tên hoặc số điện thoại</label>
    <input class="form-control mb-2" id="supplier-search" type="search" name="keyword" th:value="${keyword}" placeholder="Nhập tên có dấu, không dấu hoặc số điện thoại">
    <div class="d-flex gap-2">
      <button class="btn btn-primary flex-fill" type="submit">Tìm kiếm</button>
      <a class="btn btn-outline-secondary flex-fill" th:href="@{/suppliers(deleted=${deleted})}">Xóa tìm kiếm</a>
    </div>
  </form>
  <form th:if="${!deleted}" method="post" th:action="@{/suppliers}" class="card card-body mb-3">
    <input class="form-control mb-2" name="name" placeholder="Tên nhà cung cấp" required>
    <input class="form-control mb-2" name="phone" placeholder="Số điện thoại" type="tel">
    <button class="btn btn-primary">Thêm</button>
  </form>
  <p th:if="${#lists.isEmpty(suppliers)}" th:text="${!#strings.isEmpty(keyword) ? 'Không tìm thấy nhà cung cấp phù hợp trong danh sách này.' : (deleted ? 'Chưa có nhà cung cấp đã xóa.' : 'Chưa có nhà cung cấp đang sử dụng.')}"></p>
  <ul class="list-group">
    <li class="list-group-item d-flex flex-wrap gap-2 justify-content-between align-items-center" th:each="s : ${suppliers}">
      <div><span th:text="${s.name}"></span><small class="text-muted d-block" th:text="${s.phone}"></small></div>
      <form th:if="${isOwner and !deleted}" method="post" th:action="@{/suppliers/{id}/delete(id=${s.id})}" onsubmit="return confirm('Xóa nhà cung cấp này khỏi danh sách chọn? Phiếu cũ và công nợ vẫn được giữ nguyên.');">
        <button class="btn btn-outline-danger" type="submit">Xóa khỏi danh sách</button>
      </form>
      <form th:if="${isOwner and deleted}" method="post" th:action="@{/suppliers/{id}/restore(id=${s.id})}">
        <button class="btn btn-success" type="submit">Khôi phục</button>
      </form>
      <details th:if="${isOwner}" class="w-100" th:open="${editId == s.id}">
        <summary class="btn btn-outline-primary">Sửa tên / số điện thoại</summary>
        <form class="mt-2" method="post" th:action="@{/suppliers/{id}/edit(id=${s.id})}">
          <input type="hidden" name="deleted" th:value="${deleted}">
          <label class="form-label" th:for="|supplier-name-${s.id}|">Tên nhà cung cấp</label>
          <input class="form-control mb-2" th:id="|supplier-name-${s.id}|" name="name" th:value="${editId == s.id ? editName : s.name}" maxlength="150" required>
          <label class="form-label" th:for="|supplier-phone-${s.id}|">Số điện thoại (có thể để trống)</label>
          <input class="form-control mb-2" th:id="|supplier-phone-${s.id}|" type="tel" name="phone" th:value="${editId == s.id ? editPhone : s.phone}" maxlength="30">
          <button class="btn btn-primary w-100" type="submit">Lưu thay đổi</button>
        </form>
      </details>
    </li>
  </ul>
  <p class="small text-muted mt-2">Xóa khỏi danh sách chỉ ngừng chọn nhà cung cấp khi nhập mới; lịch sử nhập hàng và công nợ vẫn được giữ nguyên.</p>
</div>
<nav th:replace="~{fragments :: nav}"></nav>
</body>
</html>
