<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Nhập hàng')}"></head>
  <body>
    <th:block th:replace="~{fragments :: shell(true)}"></th:block>
    <main class="container py-3">
      <h1 class="h4 mb-3">Nhập hàng</h1>
      <div th:replace="~{fragments :: alerts}"></div>

      <form novalidate method="post" th:action="@{/purchases}">
        <input type="hidden" name="directEntry" value="true" />
        <input type="hidden" name="requestKey" th:value="${form.requestKey}" />
        <div id="rows">
          <div
            class="card card-body mb-3 row-item"
            th:each="it, s : ${form.items}"
            th:if="${s.first}"
          >
            <label class="form-label" for="purchase-product-name">Tên hàng</label>
            <input
              id="purchase-product-name"
              class="form-control"
              name="productName"
              list="purchase-products"
              maxlength="200"
              required
              th:value="${form.productName}"
              aria-describedby="product-name-help"
              autocomplete="off"
            />
            <small id="product-name-help" class="form-text mb-2">
              Chọn hàng đã có hoặc gõ tên mới để lưu cùng phiếu.
            </small>
            <datalist id="purchase-products">
              <option
                th:each="p : ${products}"
                th:value="${p.name}"
                th:attr="data-group=${p.productGroup},data-unit=${p.baseUnit}"
                th:text="${p.name} + ' (' + ${p.baseUnit} + ')'"
              ></option>
            </datalist>
            <label class="form-label">Nhóm hàng</label>
            <select
              class="form-select mb-2 purchase-group"
              name="productGroup"
              aria-label="Nhóm hàng"
            >
              <option value="MATERIAL" th:selected="${form.productGroup == 'MATERIAL'}">
                Vật liệu xây dựng
              </option>
              <option value="AGRICULTURE" th:selected="${form.productGroup == 'AGRICULTURE'}">
                Nông sản
              </option>
            </select>
            <div class="agriculture-fields" hidden>
              <label class="form-label">Cách nhập nông sản</label>
              <select class="form-select mb-2 entry-mode" th:name="|items[${s.index}].entryMode|">
                <option value="WEIGHT" th:selected="${it.entryMode == 'WEIGHT'}">
                  Tổng kg thực tế × giá/kg
                </option>
                <option value="BAGS" th:selected="${it.entryMode == 'BAGS'}">
                  Cân từng bao × giá/kg
                </option>
                <option value="LOT" th:selected="${it.entryMode == 'LOT'}">
                  Cả lô: tổng kg và tổng tiền
                </option>
              </select>
              <div class="bags-field" hidden>
                <label class="form-label">
                  Kg từng bao — mỗi dòng một bao (ví dụ: 48,5 rồi xuống dòng 52)
                </label>
                <textarea
                  style="resize: none"
                  class="form-control mb-2"
                  rows="4"
                  maxlength="20000"
                  th:name="|items[${s.index}].bagWeights|"
                  th:text="${it.bagWeights}"
                ></textarea>
              </div>
              <div class="lot-field money-entry mb-2" hidden>
                <label class="form-label">Tổng tiền mua cả lô (VNĐ)</label>
                <input
                  class="form-control mb-2"
                  type="number"
                  min="0"
                  step="0.01"
                  th:name="|items[${s.index}].lotAmount|"
                  th:value="${it.lotAmount}"
                />
              </div>
              <p class="small text-muted">1 tấn = 1000 kg · 1 tạ = 100 kg · 1 yến = 10 kg.</p>
            </div>
            <div class="row g-2">
              <div class="col-6 col-sm-4 qty-field">
                <label class="form-label qty-label">Số lượng</label>
                <input
                  class="form-control"
                  type="number"
                  step="any"
                  min="0"
                  placeholder="Số lượng"
                  th:name="|items[${s.index}].qty|"
                  th:value="${it.qty == null ? null : it.qty.stripTrailingZeros().toPlainString()}"
                />
              </div>
              <div class="col-6 col-sm-3">
                <label class="form-label">Đơn vị</label>
                <select class="form-select unit-select" aria-label="Đơn vị" name="baseUnit">
                  <option
                    th:each="unit : ${baseUnits}"
                    th:value="${unit}"
                    th:text="${unit}"
                    th:selected="${form.baseUnit == unit}"
                  ></option>
                </select>
              </div>
              <div class="col-12 col-sm-5 price-field">
                <div class="money-entry">
                  <label class="form-label price-label">Đơn giá / đơn vị</label>
                  <input
                    class="form-control"
                    type="number"
                    step="any"
                    min="0"
                    placeholder="Đơn giá / đơn vị"
                    th:name="|items[${s.index}].unitPrice|"
                    th:value="${it.unitPrice}"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>

        <details class="entry-options mb-3" th:open="${error != null}">
          <summary>Ngày nhập, mã lô và ghi chú</summary>
          <div class="row g-2 mt-1">
            <div class="col-6">
              <label for="entry-date" class="form-label">Ngày nhập</label>
              <input
                id="entry-date"
                type="date"
                class="form-control"
                name="orderDate"
                th:value="${form.orderDate}"
              />
            </div>
            <div class="col-6">
              <label class="form-label" for="purchase-lot-code">Mã lô</label>
              <input
                id="purchase-lot-code"
                class="form-control"
                name="lotCode"
                maxlength="50"
                th:value="${form.lotCode}"
              />
            </div>
            <div class="col-12">
              <label for="entry-note" class="form-label">Ghi chú</label>
              <input id="entry-note" class="form-control" name="note" th:value="${form.note}" />
            </div>
          </div>
        </details>
        <section class="card card-body mb-3" aria-labelledby="purchase-payment">
          <h2 class="h5" id="purchase-payment">Thanh toán tiền nhập</h2>
          <label class="form-label" for="seller-name">Người bán (nếu có)</label>
          <input
            id="seller-name"
            class="form-control"
            name="sellerName"
            maxlength="150"
            th:value="${form.sellerName}"
            aria-describedby="seller-help"
          />
          <div id="seller-help" class="form-text">Dùng tên này để tìm phiếu và trả nợ.</div>

          <div class="money-entry mt-3">
            <label for="purchase-paid" class="form-label">Số tiền đã trả</label>
            <input
              id="purchase-paid"
              class="form-control"
              type="number"
              min="0"
              step="1"
              name="paidAmount"
              placeholder="0"
              th:value="${form.paidAmount}"
            />
            <label class="form-check mt-2 mb-0 py-2">
              <input
                class="form-check-input settle-all"
                type="checkbox"
                name="settleAll"
                value="true"
                th:checked="${form.settleAll}"
              />
              <span class="form-check-label">Tất toán · Đã trả đủ cả tiền hàng và cước</span>
            </label>
          </div>
          <div class="mt-3">
            <label class="form-label text-muted" for="purchase-shipping">
              Cước vận chuyển (nếu có)
            </label>
            <input
              id="purchase-shipping"
              class="form-control"
              type="number"
              step="any"
              min="0"
              name="shippingCost"
              th:value="${form.shippingCost}"
            />
          </div>
        </section>
        <button class="btn btn-primary w-100">Lưu phiếu nhập</button>
      </form>
    </main>

    <script defer th:src="@{/js/purchase-entry.js}"></script>
    <script defer th:src="@{/js/settlement.js(v=2)}"></script>
  </body>
</html>
