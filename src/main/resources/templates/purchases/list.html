<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head(${trash ? 'Thùng rác phiếu nhập' : 'Nhập hàng'})}"></head>
  <body>
    <th:block th:replace="~{fragments :: shell(true)}"></th:block>
    <main class="container py-3">
      <header class="page-heading">
        <h1 th:text="${trash ? 'Thùng rác phiếu nhập' : 'Đơn nhập hàng'}"></h1>
        <div class="page-actions">
          <a th:if="${trash}" class="btn btn-outline-secondary" th:href="@{/purchases}">
            Lịch sử nhập
          </a>
          <a
            th:unless="${trash}"
            class="btn btn-outline-secondary"
            th:href="@{/purchases(trash=true)}"
          >
            Thùng rác
          </a>
          <a th:unless="${trash}" class="btn btn-primary" th:href="@{/purchases/new}">
            + Nhập hàng
          </a>
        </div>
      </header>
      <div th:replace="~{fragments :: alerts}"></div>
      <p th:if="${trash}" class="text-muted">
        Khôi phục phiếu để tính lại số lượng, vốn và công nợ theo lô đã nhập.
      </p>
      <th:block
        th:replace="~{fragments :: receiptSearch('/purchases', 'Tìm theo người bán, tên hàng hoặc mã lô')}"
      ></th:block>
      <p
        class="receipt-empty"
        th:if="${#lists.isEmpty(orders)}"
        th:text="${!#strings.isEmpty(keyword) ? 'Không tìm thấy phiếu nhập phù hợp.' : (trash ? 'Thùng rác chưa có phiếu nhập.' : 'Chưa có phiếu nhập. Bấm Nhập hàng để ghi lần đầu.')}"
      ></p>
      <article class="card card-body receipt" th:each="o : ${orders}">
        <div class="receipt-header">
          <div>
            <span class="receipt-meta">
              <span th:text="|Phiếu nhập #${o.id}|"></span>
              ·
              <time th:text="${#temporals.format(o.orderDate,'dd/MM/yyyy')}"></time>
            </span>
            <h2
              class="receipt-title"
              th:text="${#lists.size(o.items) == 1 ? o.items[0].product.name : #lists.size(o.items) + ' mặt hàng'}"
            ></h2>
            <span th:text="|Người bán: ${o.sellerDisplayName}|"></span>
            <span
              class="receipt-meta"
              th:if="${o.lotCode != null}"
              th:text="|Lô ${o.lotCode}|"
            ></span>
          </div>
          <div class="receipt-total">
            <span class="receipt-meta">Tổng phiếu</span>
            <strong
              th:text="${#numbers.formatDecimal(o.total,1,'POINT',0,'COMMA')} + ' VNĐ'"
            ></strong>
          </div>
        </div>
        <div class="receipt-payments">
          <span
            th:text="|Đã trả: ${#numbers.formatDecimal(o.paidAmount,1,'POINT',0,'COMMA')} VNĐ|"
          ></span>
          <strong
            class="text-danger"
            th:if="${!trash and o.total.compareTo(o.paidAmount) > 0}"
            th:text="'Còn nợ ' + ${#numbers.formatDecimal(o.total.subtract(o.paidAmount),1,'POINT',0,'COMMA')} + ' VNĐ'"
          ></strong>
        </div>
        <details class="receipt-details">
          <summary>Chi tiết phiếu nhập</summary>
          <div class="small">
            <div class="mb-2" th:each="it : ${o.items}">
              <span
                th:text="${it.product.name} + ': ' + ${it.qty.stripTrailingZeros().toPlainString()} + ' ' + ${it.product.baseUnit}"
              ></span>
              <span th:if="${it.entryMode == 'LOT'}">· Mua cả lô</span>
              <span th:if="${it.entryMode == 'BAGS'}">· Cân từng bao</span>
              <div
                th:text="|Tiền hàng: ${#numbers.formatDecimal(it.lineAmount,1,'POINT',0,'COMMA')} VNĐ|"
              ></div>
              <details th:if="${it.bagWeights != null}">
                <summary>Kg từng bao</summary>
                <div style="white-space: pre-line" th:text="${it.bagWeights}"></div>
              </details>
            </div>
          </div>
          <div
            class="small text-muted"
            th:if="${!#strings.isEmpty(o.note)}"
            th:text="${o.note}"
          ></div>

          <form
            novalidate
            class="mt-2"
            th:if="${trash or o.paidAmount.signum() == 0}"
            method="post"
            th:action="${trash} ? @{/purchases/{id}/restore(id=${o.id})} : @{/purchases/{id}/trash(id=${o.id})}"
            th:attr="data-confirm=${trash ? null : 'Tồn kho, vốn và công nợ sẽ được tính lại khi bỏ phiếu này. Bạn có thể xem và khôi phục phiếu trong Thùng rác.'},data-confirm-title=|Chuyển phiếu nhập #${o.id} vào Thùng rác?|"
            data-confirm-action="Chuyển vào Thùng rác"
          >
            <input
              th:if="${!#strings.isEmpty(keyword)}"
              type="hidden"
              name="keyword"
              th:value="${keyword}"
            />
            <button
              type="submit"
              class="btn"
              data-requires-confirmation
              th:disabled="${!trash}"
              th:classappend="${trash ? 'btn-outline-primary' : 'btn-outline-danger'}"
              th:text="${trash ? 'Khôi phục phiếu' : 'Xóa phiếu'}"
            ></button>
            <noscript th:unless="${trash}">Bật JavaScript để xác nhận xóa phiếu.</noscript>
          </form>
          <small th:if="${!trash and o.paidAmount.signum() > 0}" class="text-muted d-block mt-2">
            Phiếu đã trả tiền nên không thể xóa.
          </small>
        </details>
        <a
          class="btn btn-outline-danger receipt-pay"
          th:if="${!trash and o.total.compareTo(o.paidAmount) > 0}"
          th:href="@{/capital(section='debts')} + '#purchase-debt-' + ${o.id}"
        >
          Thanh toán
        </a>
      </article>
    </main>
  </body>
</html>
