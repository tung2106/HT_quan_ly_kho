<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Nhập hàng')}"></head>
  <body>
    <main class="container py-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Đơn nhập hàng</h1>
        <a class="btn btn-primary" th:href="@{/purchases/new}">+ Nhập hàng</a>
      </div>
      <div th:replace="~{fragments :: alerts}"></div>
      <form novalidate method="get" th:action="@{/purchases}" class="card card-body mb-3">
        <label class="form-label" for="purchase-search">Tìm người bán, tên hàng hoặc mã lô</label>
        <input
          id="purchase-search"
          name="keyword"
          type="search"
          class="form-control"
          th:value="${keyword}"
        />
        <button class="btn btn-outline-primary mt-2">Tìm phiếu nhập</button>
      </form>
      <p
        th:if="${#lists.isEmpty(orders)}"
        th:text="${#strings.isEmpty(keyword) ? 'Chưa có phiếu nhập. Bấm Nhập hàng để ghi lần đầu.' : 'Không tìm thấy phiếu nhập phù hợp.'}"
      ></p>
      <div class="card mb-2" th:each="o : ${orders}">
        <div class="card-body py-2">
          <div class="d-flex flex-wrap gap-2 justify-content-between">
            <strong th:text="${#temporals.format(o.orderDate,'dd/MM/yyyy')}"></strong>
            <span th:text="|Người bán: ${o.sellerDisplayName}|"></span>
          </div>
          <div class="small text-muted mb-2" th:text="|Phiếu nhập #${o.id}|"></div>
          <strong
            class="d-block mb-2"
            th:if="${o.lotCode != null}"
            th:text="|Lô ${o.lotCode}|"
          ></strong>
          <div class="small">
            <div class="mb-2" th:each="it : ${o.items}">
              <span
                th:text="${it.product.name} + ': ' + ${it.qty.stripTrailingZeros().toPlainString()} + ' ' + ${it.product.baseUnit}"
              ></span>
              <span th:if="${it.entryMode == 'LOT'}">· Mua cả lô</span>
              <span th:if="${it.entryMode == 'BAGS'}">· Cân từng bao</span>
              <div
                th:text="|Tiền hàng: ${#numbers.formatDecimal(it.lineAmount,1,'POINT',0,'COMMA')} VNĐ|"
              ></div>
              <details th:if="${it.bagWeights != null}">
                <summary>Kg từng bao</summary>
                <div style="white-space: pre-line" th:text="${it.bagWeights}"></div>
              </details>
            </div>
          </div>
          <div class="d-flex flex-column flex-sm-row gap-1 justify-content-between mt-1">
            <span>
              Tổng:
              <b th:text="${#numbers.formatDecimal(o.total,1,'POINT',0,'COMMA')} + ' VNĐ'"></b>
            </span>
            <span
              class="text-danger"
              th:if="${o.total.compareTo(o.paidAmount) > 0}"
              th:text="'Còn nợ ' + ${#numbers.formatDecimal(o.total.subtract(o.paidAmount),1,'POINT',0,'COMMA')} + ' VNĐ'"
            ></span>
          </div>
          <div
            th:text="|Đã trả: ${#numbers.formatDecimal(o.paidAmount,1,'POINT',0,'COMMA')} VNĐ|"
          ></div>
          <div
            class="small text-muted"
            th:if="${!#strings.isEmpty(o.note)}"
            th:text="${o.note}"
          ></div>
          <a
            class="btn btn-danger w-100 mt-2"
            th:if="${o.total.compareTo(o.paidAmount) > 0}"
            th:href="@{/capital(section='debts')} + '#purchase-debt-' + ${o.id}"
          >
            Thanh toán
          </a>
        </div>
      </div>
    </main>
    <nav th:replace="~{fragments :: nav}"></nav>
  </body>
</html>
