<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nhập hàng')}"></head>
<body>
<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Đơn nhập hàng</h5>
    <a class="btn btn-primary" th:href="@{/purchases/new}">+ Nhập hàng</a>
  </div>
  <div th:replace="~{fragments :: alerts}"></div>
  <div class="card mb-2" th:each="o : ${orders}">
    <div class="card-body py-2">
      <div class="d-flex justify-content-between">
        <strong th:text="${#temporals.format(o.orderDate,'dd/MM/yyyy')}"></strong>
        <span th:text="${o.supplier != null} ? ${o.supplier.name} : 'Không rõ NCC'"></span>
      </div>
      <div class="small">
        <div th:each="it : ${o.items}"
             th:text="${it.product.name} + ': ' + ${it.qty.stripTrailingZeros().toPlainString()} + ' ' + ${it.product.baseUnit}"></div>
      </div>
      <div class="d-flex justify-content-between mt-1">
        <span>Tổng: <b th:text="${#numbers.formatDecimal(o.total,1,'POINT',0,'COMMA')}"></b></span>
        <span class="text-danger" th:if="${o.total.compareTo(o.paidAmount) > 0}"
              th:text="'Còn nợ ' + ${#numbers.formatDecimal(o.total.subtract(o.paidAmount),1,'POINT',0,'COMMA')}"></span>
      </div>
    </div>
  </div>
</div>
<nav th:replace="~{fragments :: nav}"></nav>
</body>
</html>
