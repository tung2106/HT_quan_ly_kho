<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nhập hàng')}"></head>
<body>
<div class="container py-3">
  <h5 class="mb-3">Nhập hàng</h5>
  <div th:replace="~{fragments :: alerts}"></div>

  <form method="post" th:action="@{/purchases}">
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label">Ngày nhập</label>
        <input type="date" class="form-control" name="orderDate" th:value="${form.orderDate}">
      </div>
      <div class="col-6">
        <label class="form-label">Nhà cung cấp</label>
        <select class="form-select" name="supplierId">
          <option value="">-- không rõ --</option>
          <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"
                  th:selected="${form.supplierId != null and form.supplierId == s.id}"></option>
        </select>
      </div>
    </div>

    <div id="rows">
      <div class="card card-body mb-2 row-item" th:each="it, s : ${form.items}">
        <select class="form-select mb-2" th:name="|items[${s.index}].productId|">
          <option value="">-- chọn sản phẩm --</option>
          <option th:each="p : ${products}" th:value="${p.id}"
                  th:text="${p.name} + ' (' + ${p.baseUnit} + ')'"
                  th:selected="${it.productId != null and it.productId == p.id}"></option>
        </select>
        <div class="row g-2">
          <div class="col-4"><input class="form-control" type="number" step="any" min="0" placeholder="Số lượng"
                 th:name="|items[${s.index}].qty|" th:value="${it.qty}"></div>
          <div class="col-3"><input class="form-control" placeholder="Đơn vị" title="Để trống = đơn vị gốc"
                 th:name="|items[${s.index}].unit|" th:value="${it.unit}"></div>
          <div class="col-5"><input class="form-control" type="number" step="any" min="0" placeholder="Đơn giá / đơn vị"
                 th:name="|items[${s.index}].unitPrice|" th:value="${it.unitPrice}"></div>
        </div>
      </div>
    </div>
    <button type="button" class="btn btn-outline-secondary w-100 mb-3" onclick="addRow()">+ Thêm dòng hàng</button>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label">Cước vận chuyển</label>
        <input class="form-control" type="number" step="any" min="0" name="shippingCost" th:value="${form.shippingCost}">
      </div>
      <div class="col-6">
        <label class="form-label">Đã trả NCC</label>
        <input class="form-control" type="number" step="any" min="0" name="paidAmount" th:value="${form.paidAmount}">
      </div>
    </div>
    <input class="form-control mb-3" name="note" placeholder="Ghi chú" th:value="${form.note}">
    <button class="btn btn-primary w-100">Lưu đơn nhập</button>
  </form>
</div>

<script>
  let idx = document.querySelectorAll('.row-item').length;
  function addRow() {
    // Sao chép DOM đã được Thymeleaf escape, tránh tuần tự hóa entity/proxy Hibernate.
    const div = document.querySelector('.row-item').cloneNode(true);
    div.querySelectorAll('[name]').forEach(field => {
      field.name = field.name.replace(/\[\d+\]/, `[${idx}]`);
      field.value = '';
      if (field.tagName === 'SELECT') {
        Array.from(field.options).forEach(option => option.removeAttribute('selected'));
        field.selectedIndex = 0;
      } else {
        field.removeAttribute('value');
      }
    });
    document.getElementById('rows').appendChild(div);
    idx++;
  }
</script>
<nav th:replace="~{fragments :: nav}"></nav>
</body>
</html>
