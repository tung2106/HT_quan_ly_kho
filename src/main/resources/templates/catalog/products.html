<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Sản phẩm')}"></head>
  <body>
    <main class="container py-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Sản phẩm</h1>
        <a th:if="${isOwner}" class="btn btn-primary" th:href="@{/products/new}">+ Thêm</a>
      </div>
      <div th:replace="~{fragments :: alerts}"></div>
      <section th:each="group : ${ {'MATERIAL','AGRICULTURE'} }">
        <h2
          class="h5 mt-3"
          th:text="${group == 'MATERIAL' ? 'Vật liệu xây dựng' : 'Nông sản'}"
        ></h2>
        <div class="list-group">
          <div
            th:if="${isOwner and p.productGroup == group}"
            class="list-group-item"
            th:each="p : ${products}"
            th:classappend="${!p.active} ? 'text-muted'"
          >
            <div class="d-flex flex-wrap gap-2 justify-content-between">
              <a th:href="@{/products/{id}/edit(id=${p.id})}">
                <strong th:text="${p.name}"></strong>
              </a>
              <span
                th:text="${#numbers.formatDecimal(p.retailPrice,1,'POINT',0,'COMMA')} + ' VNĐ / ' + ${p.baseUnit}"
              ></span>
            </div>
            <small
              class="text-muted"
              th:text="'Giá vốn ' + ${#numbers.formatDecimal(p.avgCost,1,'POINT',0,'COMMA')} + ' VNĐ'"
            ></small>
            <span th:if="${!p.active}" class="badge bg-secondary">Ngừng kinh doanh</span>
            <div class="d-flex gap-2 mt-2">
              <a class="btn btn-outline-primary" th:href="@{/products/{id}/edit(id=${p.id})}">
                Sửa
              </a>
              <form
                novalidate
                th:if="${p.active}"
                method="post"
                th:action="@{/products/{id}/delete(id=${p.id})}"
                data-confirm="Ngừng nhập/bán sản phẩm này? Tồn kho, vốn và lịch sử vẫn được giữ nguyên."
                data-confirm-action="Ngừng kinh doanh"
                th:attr="data-confirm-title=|Xóa ${p.name}?|"
              >
                <button class="btn btn-outline-danger" type="submit">Xóa</button>
              </form>
            </div>
          </div>
          <div
            th:if="${!isOwner and p.active and p.productGroup == group}"
            class="list-group-item"
            th:each="p : ${products}"
          >
            <strong th:text="${p.name}"></strong>
            <span
              th:text="${#numbers.formatDecimal(p.retailPrice,1,'POINT',0,'COMMA')} + ' VNĐ / ' + ${p.baseUnit}"
            ></span>
          </div>
        </div>
      </section>
    </main>
    <nav th:replace="~{fragments :: nav}"></nav>
  </body>
</html>
