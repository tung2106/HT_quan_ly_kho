<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Danh mục')}"></head>
  <body>
    <th:block th:replace="~{fragments :: shell(true)}"></th:block>
    <main class="container py-3">
      <h1 class="h4 mb-3">Danh mục</h1>
      <div th:replace="~{fragments :: alerts}"></div>
      <form novalidate method="post" th:action="@{/categories}" class="card card-body mb-3">
        <input
          class="form-control mb-2"
          name="name"
          placeholder="Tên danh mục (vd: Xi măng, Sắn...)"
          required
        />
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" name="perishable" value="true" id="per" />
          <label class="form-check-label" for="per">Hàng dễ hư (nông sản)</label>
        </div>
        <button class="btn btn-primary">Thêm</button>
      </form>
      <ul class="list-group">
        <li class="list-group-item" th:each="c : ${categories}">
          <span th:text="${c.name}"></span>
          <span class="badge bg-warning text-dark" th:if="${c.perishable}">Dễ hư</span>
          <details class="mt-2">
            <summary class="btn btn-outline-primary">Sửa danh mục</summary>
            <form
              novalidate
              method="post"
              th:action="@{/categories/{id}/edit(id=${c.id})}"
              class="mt-2"
            >
              <label class="form-label">Tên danh mục</label>
              <input
                class="form-control mb-2"
                name="name"
                th:value="${c.name}"
                maxlength="100"
                required
              />
              <label class="mb-2">
                <input
                  type="checkbox"
                  name="perishable"
                  value="true"
                  th:checked="${c.perishable}"
                />
                Hàng dễ hư
              </label>
              <button class="btn btn-primary w-100">Lưu thay đổi</button>
            </form>
          </details>
          <form
            novalidate
            class="mt-2"
            method="post"
            th:action="@{/categories/{id}/delete(id=${c.id})}"
            data-confirm="Danh mục chưa có sản phẩm sẽ bị xóa. Danh mục đang có sản phẩm được giữ lại."
            data-confirm-action="Xóa danh mục"
            th:attr="data-confirm-title=|Xóa ${c.name}?|"
          >
            <button class="btn btn-outline-danger">Xóa danh mục</button>
          </form>
        </li>
      </ul>
    </main>
  </body>
</html>
