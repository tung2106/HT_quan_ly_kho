<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đổi mật khẩu')}"></head>
<body><main class="container py-3" style="max-width:520px"><div class="card card-body">
<h1 class="h4">Đổi mật khẩu của tôi</h1><p>Tài khoản mới hoặc vừa được đặt lại mật khẩu phải đổi mật khẩu trước khi sử dụng.</p>
<div th:replace="~{fragments :: alerts}"></div><form method="post" th:action="@{/account/password}">
<label class="form-label" for="old">Mật khẩu hiện tại</label><input id="old" class="form-control mb-3" type="password" name="oldPassword" autocomplete="current-password" required>
<label class="form-label" for="new">Mật khẩu mới (ít nhất 12 ký tự)</label><input id="new" class="form-control mb-3" type="password" name="newPassword" autocomplete="new-password" minlength="12" required>
<label class="form-label" for="confirm">Nhập lại mật khẩu mới</label><input id="confirm" class="form-control mb-3" type="password" name="confirm" autocomplete="new-password" minlength="12" required>
<button class="btn btn-primary w-100">Lưu mật khẩu mới</button></form>
<form method="post" th:action="@{/logout}" class="mt-3"><button class="btn btn-outline-secondary w-100">Đăng xuất</button></form>
</div></main></body></html>
