<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Danh mục')}"></head>
<body>
<div class="container py-3">
  <h5 class="mb-3">Danh mục</h5>
  <div th:replace="~{fragments :: alerts}"></div>
  <form method="post" th:action="@{/categories}" class="card card-body mb-3">
    <input class="form-control mb-2" name="name" placeholder="Tên danh mục (vd: Xi măng, Sắn...)" required>
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" name="perishable" value="true" id="per">
      <label class="form-check-label" for="per">Hàng dễ hư (nông sản)</label>
    </div>
    <button class="btn btn-primary">Thêm</button>
  </form>
  <ul class="list-group">
    <li class="list-group-item" th:each="c : ${categories}">
      <span th:text="${c.name}"></span>
      <span class="badge bg-warning text-dark" th:if="${c.perishable}">Dễ hư</span>
      <details class="mt-2"><summary class="btn btn-outline-primary">Sửa danh mục</summary>
        <form method="post" th:action="@{/categories/{id}/edit(id=${c.id})}" class="mt-2">
          <label class="form-label">Tên danh mục</label><input class="form-control mb-2" name="name" th:value="${c.name}" maxlength="100" required>
          <label class="mb-2"><input type="checkbox" name="perishable" value="true" th:checked="${c.perishable}"> Hàng dễ hư</label>
          <button class="btn btn-primary w-100">Lưu thay đổi</button>
        </form>
      </details>
      <form class="mt-2" method="post" th:action="@{/categories/{id}/delete(id=${c.id})}" onsubmit="return confirm('Xóa danh mục này? Danh mục có sản phẩm sẽ được giữ lại.');">
        <button class="btn btn-outline-danger">Xóa danh mục</button>
      </form>
    </li>
  </ul>
</div>
<nav th:replace="~{fragments :: nav}"></nav>
</body>
</html>
