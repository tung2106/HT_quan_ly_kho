<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Các lô còn tồn')}"></head>
  <body>
    <main class="container py-3">
      <h1 class="h5">Các lô còn tồn</h1>
      <th:block
        th:replace="~{fragments :: stockFilter('/stock/lots', ${selectedGroup})}"
      ></th:block>
      <p>Giá vốn từng lô đã gồm cước nhập hàng được phân bổ.</p>
      <section
        th:each="group : ${ {'MATERIAL','AGRICULTURE'} }"
        th:if="${selectedGroup == '' or selectedGroup == group}"
        class="mb-4"
      >
        <h2 class="h5" th:text="${group == 'AGRICULTURE' ? 'Nông sản' : 'Vật liệu xây dựng'}"></h2>
        <p class="text-muted" th:if="${#lists.isEmpty(productLots.?[group() == #vars.group])}">
          Nhóm này chưa có lô còn tồn.
        </p>
        <details
          class="card mb-2"
          th:each="product : ${productLots}"
          th:if="${product.group() == group}"
        >
          <summary
            class="p-3 fw-bold"
            th:text="|${product.name()} · ${#lists.size(product.batches())} lô còn tồn|"
          ></summary>
          <div class="px-2 pb-2">
            <div class="card card-body mb-2" th:each="b : ${product.batches()}">
              <strong th:text="|Lô ${b.lot_code}|"></strong>
              <span th:text="|Ngày nhập ${b.received_date}|"></span>
              <span th:text="|Người bán: ${b.seller}|"></span>
              <span
                th:if="${b.purchase_id != null}"
                th:text="|Phiếu nhập #${b.purchase_id}|"
              ></span>
              <span
                th:text="|Đã nhập: ${b.qty_in.stripTrailingZeros().toPlainString()} ${b.base_unit}|"
              ></span>
              <strong
                th:text="|Còn lại: ${b.qty_left.stripTrailingZeros().toPlainString()} ${b.base_unit}|"
              ></strong>
              <span
                th:text="|Giá vốn: ${#numbers.formatDecimal(b.unit_cost,1,'POINT',0,'COMMA')} VNĐ / ${b.base_unit}|"
              ></span>
              <span
                th:text="|Vốn còn lại: ${#numbers.formatDecimal(b.unit_cost.multiply(b.qty_left),1,'POINT',0,'COMMA')} VNĐ|"
              ></span>
              <span th:unless="${b.active}" class="text-muted">Sản phẩm đã ngừng kinh doanh</span>
            </div>
          </div>
        </details>
      </section>
    </main>
    <nav th:replace="~{fragments :: nav}"></nav>
  </body>
</html>
