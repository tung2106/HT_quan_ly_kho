<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="|${title} · Kho gia đình|">Kho gia đình</title>
    <script th:src="@{/js/theme.js(v=1)}"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/sky.css(v=9)}" />
    <script
      defer
      th:src="@{/js/ui.js(v=5)}"
      th:attr="data-icons=@{/images/ui-icons.svg(v=3)}"
    ></script>
    <script
      defer
      th:src="@{/js/loading.js(v=2)}"
      th:attr="data-cat-src=@{/images/loading-cat.png}"
    ></script>
    <script defer th:src="@{/js/unit-select.js}"></script>
    <script defer th:src="@{/js/money-input.js}"></script>
    <script defer th:src="@{/js/back.js(v=4)}" th:attr="data-home=@{/}"></script>
  </head>
  <body>
    <svg
      th:fragment="icon(name)"
      class="ui-icon"
      width="24"
      height="24"
      aria-hidden="true"
      focusable="false"
    >
      <use th:href="@{/images/ui-icons.svg(v=3)} + '#' + ${name}"></use>
    </svg>
    <th:block th:fragment="shell(showNav)">
      <header class="app-header">
        <div class="container app-header-inner">
          <a class="app-brand" th:href="@{/}" aria-label="Kho gia đình · Trang chủ">
            <span class="brand-mark"><svg th:replace="~{fragments :: icon('stock')}"></svg></span>
            Kho gia đình
          </a>
          <nav th:if="${showNav}" class="navbar app-nav" aria-label="Chức năng chính">
            <div class="app-nav-items">
              <a data-nav="home" th:href="@{/}">
                <svg th:replace="~{fragments :: icon('home')}"></svg>
                <span>Trang chủ</span>
              </a>
              <a data-nav="stock" th:href="@{/stock}">
                <svg th:replace="~{fragments :: icon('stock')}"></svg>
                <span>Hàng còn</span>
              </a>
              <a data-nav="purchases" th:if="${isOwner}" th:href="@{/purchases}">
                <svg th:replace="~{fragments :: icon('in')}"></svg>
                <span>Nhập hàng</span>
              </a>
              <a data-nav="outbound" th:href="@{/outbound}">
                <svg th:replace="~{fragments :: icon('out')}"></svg>
                <span>Bán hàng</span>
              </a>
              <a data-nav="capital" th:if="${isOwner}" th:href="@{/capital}">
                <svg th:replace="~{fragments :: icon('money')}"></svg>
                <span>Vốn / Nợ</span>
              </a>
            </div>
          </nav>
          <button
            type="button"
            class="btn settings-trigger"
            data-dialog-open="app-settings"
            aria-haspopup="dialog"
            aria-controls="app-settings"
            aria-expanded="false"
          >
            <svg th:replace="~{fragments :: icon('settings')}"></svg>
            <span>Cài đặt</span>
          </button>
        </div>
      </header>
      <dialog id="app-settings" class="ui-dialog settings-dialog" aria-labelledby="settings-title">
        <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
          <h2 id="settings-title" class="mb-0">Cài đặt</h2>
          <button
            type="button"
            class="btn dialog-dismiss"
            data-dialog-close
            autofocus
            aria-label="Đóng cài đặt"
          >
            <svg th:replace="~{fragments :: icon('close')}"></svg>
          </button>
        </div>
        <p class="text-muted settings-account" th:text="|Tài khoản: ${loginName}|"></p>
        <section aria-labelledby="settings-appearance">
          <h3 id="settings-appearance" class="h6">Giao diện</h3>
          <div class="theme-switch" role="group" aria-label="Chọn giao diện">
            <button type="button" class="btn theme-choice" data-theme="light" aria-pressed="true">
              <svg th:replace="~{fragments :: icon('sun')}"></svg>
              Sáng
            </button>
            <button type="button" class="btn theme-choice" data-theme="dark" aria-pressed="false">
              <svg th:replace="~{fragments :: icon('moon')}"></svg>
              Tối
            </button>
          </div>
          <p class="visually-hidden" data-theme-status role="status"></p>
        </section>
        <section th:if="${isOwner}" class="settings-section" aria-labelledby="settings-manage">
          <h3 id="settings-manage" class="h6">Quản lý</h3>
          <a class="settings-link" th:href="@{/products}">
            <svg th:replace="~{fragments :: icon('tag')}"></svg>
            <span>Sản phẩm</span>
            <svg th:replace="~{fragments :: icon('chevron')}"></svg>
          </a>
          <a class="settings-link" th:href="@{/admin/users}">
            <svg th:replace="~{fragments :: icon('people')}"></svg>
            <span>Quản lý tài khoản</span>
            <svg th:replace="~{fragments :: icon('chevron')}"></svg>
          </a>
        </section>
        <section class="settings-section" aria-labelledby="settings-account-title">
          <h3 id="settings-account-title" class="h6">Tài khoản</h3>
          <a class="settings-link" th:href="@{/account/password}">
            <svg th:replace="~{fragments :: icon('key')}"></svg>
            <span>Đổi mật khẩu</span>
            <svg th:replace="~{fragments :: icon('chevron')}"></svg>
          </a>
          <form novalidate method="post" th:action="@{/logout}" class="settings-signout">
            <button class="settings-link" type="submit">
              <svg th:replace="~{fragments :: icon('logout')}"></svg>
              Đăng xuất
            </button>
          </form>
        </section>
      </dialog>
    </th:block>
    <form
      th:fragment="receiptSearch(path, label)"
      novalidate
      method="get"
      th:action="@{${path}}"
      class="receipt-search"
    >
      <input th:if="${trash}" type="hidden" name="trash" value="true" />
      <label class="form-label" for="receipt-search" th:text="${label}"></label>
      <div class="receipt-search-controls">
        <input
          id="receipt-search"
          name="keyword"
          type="search"
          class="form-control"
          th:value="${keyword}"
        />
        <button class="btn btn-outline-primary" type="submit">Tìm</button>
      </div>
    </form>
    <form
      th:fragment="stockFilter(path, selectedGroup)"
      novalidate
      method="get"
      th:action="@{${path}}"
      class="row g-2 mb-3"
    >
      <div class="col-8 col-sm-6">
        <label for="stock-group" class="form-label">Lọc loại hàng</label>
        <select id="stock-group" name="group" class="form-select">
          <option value="" th:selected="${selectedGroup == ''}">Tất cả</option>
          <option value="MATERIAL" th:selected="${selectedGroup == 'MATERIAL'}">
            Vật liệu xây dựng
          </option>
          <option value="AGRICULTURE" th:selected="${selectedGroup == 'AGRICULTURE'}">
            Nông sản
          </option>
        </select>
      </div>
      <div class="col-4 col-sm-auto align-self-end">
        <button type="submit" class="btn btn-primary w-100">Lọc</button>
      </div>
    </form>
    <div th:fragment="alerts">
      <div class="alert alert-success py-2" role="status" th:if="${msg}" th:text="${msg}"></div>
      <div class="alert alert-danger py-2" role="alert" th:if="${error}" th:text="${error}"></div>
    </div>
  </body>
</html>
