<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' - Vật liệu'">Vật liệu</title>
    <script th:src="@{/js/theme.js(v=1)}"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/sky.css(v=7)}" />
    <script defer th:src="@{/js/ui.js(v=3)}"></script>
    <script
      defer
      th:src="@{/js/loading.js}"
      th:attr="data-cat-src=@{/images/loading-cat.png}"
    ></script>
    <script defer th:src="@{/js/unit-select.js}"></script>
    <script defer th:src="@{/js/money-input.js}"></script>
    <script defer th:src="@{/js/back.js}" th:attr="data-home=@{/}"></script>
  </head>
  <body>
    <svg
      th:fragment="icon(name)"
      class="ui-icon"
      width="24"
      height="24"
      aria-hidden="true"
      focusable="false"
    >
      <use th:href="@{/images/ui-icons.svg} + '#' + ${name}"></use>
    </svg>
    <th:block th:fragment="settings">
      <header class="container pt-3 d-flex gap-2 align-items-start app-toolbar" data-app-toolbar>
        <button
          type="button"
          class="btn btn-outline-secondary settings-trigger ms-auto"
          data-dialog-open="app-settings"
          aria-haspopup="dialog"
          aria-controls="app-settings"
          aria-expanded="false"
        >
          <svg th:replace="~{fragments :: icon('settings')}"></svg>
          <span>Cài đặt</span>
        </button>
      </header>
      <dialog id="app-settings" class="ui-dialog settings-dialog" aria-labelledby="settings-title">
        <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
          <h2 id="settings-title" class="mb-0">Cài đặt</h2>
          <button type="button" class="btn btn-outline-secondary" data-dialog-close autofocus>
            Đóng
          </button>
        </div>
        <p class="text-muted settings-account" th:text="|Tài khoản: ${loginName}|"></p>
        <section aria-labelledby="settings-appearance">
          <h3 id="settings-appearance" class="h6">Giao diện</h3>
          <div class="d-flex gap-2" role="group" aria-label="Chọn giao diện">
            <button
              type="button"
              class="btn theme-choice flex-fill"
              data-theme="light"
              aria-pressed="true"
            >
              Sáng
            </button>
            <button
              type="button"
              class="btn theme-choice flex-fill"
              data-theme="dark"
              aria-pressed="false"
            >
              Tối
            </button>
          </div>
          <p class="small text-muted mt-2" data-theme-status role="status"></p>
        </section>
        <section th:if="${isOwner}" class="settings-section" aria-labelledby="settings-manage">
          <h3 id="settings-manage" class="h6">Quản lý</h3>
          <a class="settings-link" th:href="@{/products}">
            <span>
              <strong>Sản phẩm</strong>
              <small>Thêm, sửa tên, đơn vị và ngừng sử dụng</small>
            </span>
            <span aria-hidden="true">→</span>
          </a>
          <a class="settings-link" th:href="@{/admin/users}">
            <span>
              <strong>Quản lý tài khoản</strong>
              <small>Cấp tài khoản, phân quyền và khóa tài khoản</small>
            </span>
            <span aria-hidden="true">→</span>
          </a>
        </section>
        <section class="settings-section" aria-labelledby="settings-account-title">
          <h3 id="settings-account-title" class="h6">Tài khoản</h3>
          <a class="settings-link" th:href="@{/account/password}">
            Đổi mật khẩu
            <span aria-hidden="true">→</span>
          </a>
          <form novalidate method="post" th:action="@{/logout}" class="mt-3">
            <button class="btn btn-outline-secondary w-100" type="submit">Đăng xuất</button>
          </form>
        </section>
      </dialog>
    </th:block>
    <th:block th:fragment="nav">
      <th:block th:replace="~{fragments :: settings}"></th:block>
      <nav class="navbar fixed-bottom bg-light border-top p-0" aria-label="Chức năng chính">
        <div class="container-fluid d-flex justify-content-around text-center small">
          <a class="py-2 px-1 text-decoration-none" data-nav="home" th:href="@{/}">
            <svg th:replace="~{fragments :: icon('home')}"></svg>
            <span>Trang chủ</span>
          </a>
          <a class="py-2 px-1 text-decoration-none" data-nav="stock" th:href="@{/stock}">
            <svg th:replace="~{fragments :: icon('stock')}"></svg>
            <span>Hàng còn</span>
          </a>
          <a
            class="py-2 px-1 text-decoration-none"
            data-nav="purchases"
            th:if="${isOwner}"
            th:href="@{/purchases}"
          >
            <svg th:replace="~{fragments :: icon('in')}"></svg>
            <span>Nhập hàng</span>
          </a>
          <a class="py-2 px-1 text-decoration-none" data-nav="outbound" th:href="@{/outbound}">
            <svg th:replace="~{fragments :: icon('out')}"></svg>
            <span>Bán hàng</span>
          </a>
          <a
            class="py-2 px-1 text-decoration-none"
            data-nav="capital"
            th:if="${isOwner}"
            th:href="@{/capital}"
          >
            <svg th:replace="~{fragments :: icon('money')}"></svg>
            <span>Vốn / Nợ</span>
          </a>
        </div>
      </nav>
    </th:block>
    <form
      th:fragment="stockFilter(path, selectedGroup)"
      novalidate
      method="get"
      th:action="@{${path}}"
      class="row g-2 mb-3"
    >
      <div class="col-8 col-sm-6">
        <label for="stock-group" class="form-label">Lọc loại hàng</label>
        <select id="stock-group" name="group" class="form-select">
          <option value="" th:selected="${selectedGroup == ''}">Tất cả</option>
          <option value="MATERIAL" th:selected="${selectedGroup == 'MATERIAL'}">
            Vật liệu xây dựng
          </option>
          <option value="AGRICULTURE" th:selected="${selectedGroup == 'AGRICULTURE'}">
            Nông sản
          </option>
        </select>
      </div>
      <div class="col-4 col-sm-auto align-self-end">
        <button type="submit" class="btn btn-primary w-100">Lọc</button>
      </div>
    </form>
    <div th:fragment="alerts">
      <div class="alert alert-success py-2" role="status" th:if="${msg}" th:text="${msg}"></div>
      <div class="alert alert-danger py-2" role="alert" th:if="${error}" th:text="${error}"></div>
    </div>
  </body>
</html>
