<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' - Vật liệu'">Vật liệu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sky.css}">
  <script defer th:src="@{/js/loading.js}" th:attr="data-cat-src=@{/images/loading-cat.png}"></script>
  <script defer th:src="@{/js/unit-select.js}"></script>
  <script defer th:src="@{/js/back.js}" th:attr="data-home=@{/}"></script>
</head>
<body>
<nav th:fragment="nav" class="navbar fixed-bottom bg-light border-top p-0">
  <div class="container-fluid d-flex justify-content-around text-center small">
    <a class="py-2 px-1 text-decoration-none" th:href="@{/}">⌂<br>Trang chủ</a>
    <a class="py-2 px-1 text-decoration-none" th:href="@{/stock}">📦<br>Tồn kho</a>
    <a class="py-2 px-1 text-decoration-none" th:if="${isOwner}" th:href="@{/purchases}">🚚<br>Nhập hàng</a>
    <a class="py-2 px-1 text-decoration-none" th:href="@{/outbound}">↗<br>Xuất kho</a>
    <a class="py-2 px-1 text-decoration-none" th:if="${isOwner}" th:href="@{/capital}">₫<br>Vốn / Nợ</a>
  </div>
</nav>
<div th:fragment="alerts">
  <div class="alert alert-success py-2" th:if="${msg}" th:text="${msg}"></div>
  <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
