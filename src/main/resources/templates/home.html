<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Trang chủ')}"></head>
  <body>
    <th:block th:replace="~{fragments :: shell(true)}"></th:block>
    <main class="container py-3 home-page">
      <header class="home-welcome">
        <div>
          <h1>Quản lý cửa hàng</h1>
          <p>Vật liệu xây dựng &amp; nông sản</p>
        </div>
        <div class="home-cat-gallery" role="group" aria-label="Ảnh mèo">
          <div class="home-cat-frame" aria-live="polite" aria-atomic="true">
            <img
              th:src="@{/images/loading-cat.png}"
              alt="Mèo may mắn ôm tiền vàng"
              width="112"
              height="162"
              draggable="false"
            />
          </div>
          <template>
            <img th:src="@{/images/home-cats/tien-viet.webp}" alt="Mèo bên tờ tiền Việt Nam" />
            <img
              th:src="@{/images/home-cats/tot-nghiep.webp}"
              alt="Mèo đội mũ tốt nghiệp cầm hai thỏi vàng"
            />
            <img th:src="@{/images/home-cats/tui-tien.webp}" alt="Mèo ôm túi tiền" />
            <img th:src="@{/images/home-cats/om-tien.webp}" alt="Mèo vàng ôm tiền khi ngủ" />
            <img
              th:src="@{/images/home-cats/day-chuyen.webp}"
              alt="Mèo đeo dây chuyền bên xe chở tiền"
            />
            <img
              th:src="@{/images/home-cats/nam-tren-tien.webp}"
              alt="Mèo nằm trên những xấp tiền"
            />
            <img
              th:src="@{/images/home-cats/meo-xam.webp}"
              alt="Mèo xám giơ chân giữa những tờ tiền"
            />
          </template>
          <button type="button" data-step="-1" aria-label="Ảnh mèo trước" hidden>
            <svg th:replace="~{fragments :: icon('chevron')}"></svg>
          </button>
          <button type="button" data-step="1" aria-label="Ảnh mèo tiếp theo" hidden>
            <svg th:replace="~{fragments :: icon('chevron')}"></svg>
          </button>
        </div>
      </header>
      <h2 class="h5 mt-3 mb-3">Ghi giao dịch</h2>
      <div class="home-grid">
        <a class="home-tile home-primary" th:href="@{/purchases/new}">
          <span class="home-icon"><svg th:replace="~{fragments :: icon('in')}"></svg></span>
          <strong>Nhập hàng</strong>
        </a>
        <a class="home-tile home-primary" th:href="@{/outbound/new}">
          <span class="home-icon"><svg th:replace="~{fragments :: icon('out')}"></svg></span>
          <strong>Xuất bán</strong>
        </a>
        <a class="home-tile" th:href="@{/outbound/new(kind='WASTE')}">
          <span class="home-icon"><svg th:replace="~{fragments :: icon('leaf')}"></svg></span>
          <strong>Ghi hao hụt</strong>
        </a>
      </div>
      <section
        th:if="${money != null}"
        class="card card-body mt-3 money-overview"
        aria-label="Tiền cửa hàng"
      >
        <div>
          <span>Vốn trong hàng còn</span>
          <strong
            th:text="${#numbers.formatDecimal(money.inventory,1,'POINT',0,'COMMA')} + ' VNĐ'"
          ></strong>
        </div>
        <div>
          <span>Đã chi nhập hàng</span>
          <strong
            class="text-danger"
            th:text="${#numbers.formatDecimal(money.payments,1,'POINT',0,'COMMA')} + ' VNĐ'"
          ></strong>
        </div>
        <div>
          <span>Đã thu tiền bán</span>
          <strong
            class="text-success"
            th:text="${#numbers.formatDecimal(money.receipts,1,'POINT',0,'COMMA')} + ' VNĐ'"
          ></strong>
        </div>
      </section>
      <h2 class="h5 mt-4 mb-3">Theo dõi hàng &amp; tiền</h2>
      <div class="home-grid">
        <a class="home-tile" th:href="@{/stock}">
          <span class="home-icon"><svg th:replace="~{fragments :: icon('stock')}"></svg></span>
          <strong>Hàng còn &amp; vốn</strong>
        </a>
        <a class="home-tile" th:href="@{/stock/lots}">
          <span class="home-icon"><svg th:replace="~{fragments :: icon('stock')}"></svg></span>
          <strong>Các lô còn tồn</strong>
        </a>
        <a class="home-tile" th:href="@{/capital}">
          <span class="home-icon"><svg th:replace="~{fragments :: icon('money')}"></svg></span>
          <strong>Vốn &amp; công nợ</strong>
        </a>
      </div>
      <h2 class="h5 mt-4 mb-3">Tra cứu phiếu</h2>
      <div class="home-history-links">
        <a th:href="@{/purchases}">
          <svg th:replace="~{fragments :: icon('in')}"></svg>
          Đã nhập của ai
          <span aria-hidden="true">→</span>
        </a>
        <a th:href="@{/outbound}">
          <svg th:replace="~{fragments :: icon('receipt')}"></svg>
          <span>Đã bán cho ai</span>
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </main>
    <script defer th:src="@{/js/home-cats.js}"></script>
  </body>
</html>
