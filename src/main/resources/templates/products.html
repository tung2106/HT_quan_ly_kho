<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sản phẩm')}"></head>
<body>
<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Sản phẩm</h5>
    <a th:if="${isOwner}" class="btn btn-primary" th:href="@{/products/new}">+ Thêm</a>
  </div>
  <div th:replace="~{fragments :: alerts}"></div>
  <div class="list-group">
    <a th:if="${isOwner}" class="list-group-item list-group-item-action" th:each="p : ${products}"
       th:href="@{/products/{id}/edit(id=${p.id})}" th:classappend="${!p.active} ? 'text-muted'">
      <div class="d-flex justify-content-between">
        <strong th:text="${p.name}"></strong>
        <span th:text="${#numbers.formatDecimal(p.retailPrice,1,'POINT',0,'COMMA')} + ' / ' + ${p.baseUnit}"></span>
      </div>
      <small class="text-muted" th:text="${p.category.name} + ' · giá vốn ' + ${#numbers.formatDecimal(p.avgCost,1,'POINT',0,'COMMA')}"></small>
    </a>
    <div th:unless="${isOwner}" class="list-group-item" th:each="p : ${products}">
      <strong th:text="${p.name}"></strong>
      <span th:text="${#numbers.formatDecimal(p.retailPrice,1,'POINT',0,'COMMA')} + ' / ' + ${p.baseUnit}"></span>
    </div>
  </div>
</div>
<nav th:replace="~{fragments :: nav}"></nav>
</body>
</html>
