<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Tài khoản')}"></head>
<body><main class="container py-3"><h1 class="h4">Quản lý tài khoản</h1><div th:replace="~{fragments :: alerts}"></div>
<form method="post" th:action="@{/admin/users}" class="card card-body mb-3"><h2 class="h5">Cấp tài khoản</h2>
<label class="form-label" for="username">Tên đăng nhập</label><input id="username" class="form-control mb-2" name="username" pattern="[a-z0-9][a-z0-9._-]{2,49}" maxlength="50" autocomplete="off" required>
<label class="form-label" for="fullName">Họ tên</label><input id="fullName" class="form-control mb-2" name="fullName" maxlength="100" required>
<label class="form-label" for="role">Vai trò</label><select id="role" class="form-select mb-2" name="role"><option value="STAFF">Người dùng thường</option><option value="OWNER">Quản lý</option></select>
<label class="form-label" for="password">Mật khẩu tạm (ít nhất 12 ký tự)</label><input id="password" class="form-control mb-3" type="password" name="password" autocomplete="new-password" minlength="12" required>
<button class="btn btn-primary">Tạo tài khoản</button></form>
<div class="card card-body mb-2" th:each="u : ${users}"><strong th:text="|${u.full_name} (${u.username})|"></strong>
<span th:text="${u.role == 'OWNER' ? 'Quản lý' : 'Người dùng thường'}"></span><span th:text="${u.active ? 'Đang hoạt động' : 'Đã khóa'}"></span>
<div th:if="${u.username != loginName}">
<form class="mt-2" method="post" th:action="@{/admin/users/{id}/active(id=${u.id})}"><input type="hidden" name="active" th:value="${!u.active}"><button class="btn btn-outline-secondary" th:text="${u.active ? 'Khóa tài khoản' : 'Mở khóa'}"></button></form>
<details class="mt-2"><summary>Đặt lại mật khẩu</summary><form method="post" th:action="@{/admin/users/{id}/password(id=${u.id})}" class="mt-2">
<input type="password" class="form-control mb-2" name="password" minlength="12" autocomplete="new-password" placeholder="Mật khẩu tạm mới" aria-label="Mật khẩu tạm mới" required><button class="btn btn-outline-primary">Đặt lại mật khẩu</button></form></details></div></div>
</main><nav th:replace="~{fragments :: nav}"></nav></body></html>
