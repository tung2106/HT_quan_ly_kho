<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head(${trash ? 'Thùng rác phiếu bán' : 'Xuất kho'})}"></head>
  <body>
    <th:block th:replace="~{fragments :: shell(true)}"></th:block>
    <main class="container py-3">
      <header class="page-heading">
        <h1 th:text="${trash ? 'Thùng rác phiếu bán' : 'Hàng đã bán &amp; xuất'}"></h1>
        <div class="page-actions">
          <a
            th:if="${isOwner and !trash}"
            class="btn btn-outline-secondary"
            th:href="@{/outbound(trash=true)}"
          >
            Thùng rác
          </a>
          <a th:if="${trash}" class="btn btn-outline-secondary" th:href="@{/outbound}">
            Lịch sử xuất
          </a>
          <a
            th:if="${isOwner and !trash}"
            class="btn btn-outline-secondary"
            th:href="@{/outbound/new(kind='WASTE')}"
          >
            Hao hụt
          </a>
          <a th:unless="${trash}" class="btn btn-primary" th:href="@{/outbound/new}">+ Xuất bán</a>
        </div>
      </header>
      <div th:replace="~{fragments :: alerts}"></div>
      <p th:if="${trash}" class="text-muted">
        Khôi phục phiếu sẽ xuất lại hàng từ đúng các lô cũ và ghi lại doanh thu, giá vốn, công nợ.
      </p>
      <th:block
        th:replace="~{fragments :: receiptSearch('/outbound', 'Tìm theo người nhận hoặc mã phiếu')}"
      ></th:block>
      <p
        class="receipt-empty"
        th:if="${#lists.isEmpty(orders)}"
        th:text="${!#strings.isEmpty(keyword) ? 'Không tìm thấy phiếu xuất phù hợp.' : (trash ? 'Thùng rác chưa có phiếu bán.' : 'Chưa có phiếu xuất.')}"
      ></p>
      <article class="card card-body receipt" th:each="o : ${orders}">
        <a class="sale-receipt" th:href="@{/outbound/{id}(id=${o.id})}">
          <strong th:text="|#${o.id} — ${o.kind == 'SALE' ? 'Xuất bán' : 'Hao hụt'}|"></strong>
          <span class="receipt-meta" th:text="${o.created_at}"></span>
          <span
            th:if="${o.kind == 'SALE'}"
            th:text="|Người nhận: ${#strings.isEmpty(o.customer) ? 'Khách lẻ' : o.customer}|"
          ></span>
          <span
            th:if="${o.kind == 'SALE'}"
            class="sale-amount"
            th:text="|Tiền bán: ${#numbers.formatDecimal(o.total_amount,1,'POINT',0,'COMMA')} VNĐ|"
          ></span>
          <span
            th:if="${o.kind == 'SALE'}"
            th:text="|Đã thu: ${#numbers.formatDecimal(o.paid_amount,1,'POINT',0,'COMMA')} VNĐ|"
          ></span>
          <span
            class="text-danger"
            th:if="${!trash and o.kind == 'SALE' and o.total_amount.compareTo(o.paid_amount) > 0}"
            th:text="|Còn nợ: ${#numbers.formatDecimal(o.total_amount.subtract(o.paid_amount),1,'POINT',0,'COMMA')} VNĐ|"
          ></span>
          <span
            th:if="${o.kind == 'WASTE'}"
            th:text="|Giá vốn hao hụt: ${#numbers.formatDecimal(o.cost_amount,1,'POINT',0,'COMMA')} VNĐ|"
          ></span>
        </a>
        <th:block
          th:fragment="trashActions(o,trash,keyword)"
          th:if="${isOwner and o.kind == 'SALE'}"
        >
          <form
            novalidate
            method="post"
            class="mt-2"
            th:if="${trash or o.paid_amount.signum() == 0}"
            th:action="${trash} ? @{/outbound/{id}/restore(id=${o.id})} : @{/outbound/{id}/trash(id=${o.id})}"
            th:attr="data-confirm=${trash ? null : 'Hàng sẽ được trả về các lô đã xuất. Doanh thu, giá vốn đã bán và công nợ khách hàng sẽ được tính lại. Bạn có thể khôi phục phiếu trong Thùng rác.'},data-confirm-title=|Chuyển phiếu bán #${o.id} vào Thùng rác?|"
            data-confirm-action="Chuyển vào Thùng rác"
          >
            <input
              th:if="${!#strings.isEmpty(keyword)}"
              type="hidden"
              name="keyword"
              th:value="${keyword}"
            />
            <button
              type="submit"
              class="btn"
              data-requires-confirmation
              th:disabled="${!trash}"
              th:classappend="${trash ? 'btn-outline-primary' : 'btn-outline-danger'}"
              th:text="${trash ? 'Khôi phục phiếu' : 'Xóa phiếu'}"
            ></button>
            <noscript th:unless="${trash}">Bật JavaScript để xác nhận xóa phiếu.</noscript>
          </form>
          <small th:if="${!trash and o.paid_amount.signum() > 0}" class="text-muted d-block mt-2">
            Phiếu đã thu tiền khách nên không thể xóa.
          </small>
        </th:block>
      </article>
    </main>
  </body>
</html>
